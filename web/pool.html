<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendSeal 团队预算池 · Pool Console</title>
<style>
  :root { --bg:#0b0e14; --panel:#141926; --line:#232c42; --txt:#e8ecf4; --dim:#8b96b0;
          --ok:#2fbf71; --bad:#ff5d5d; --warn:#ffb84d; --accent:#5b8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:"Segoe UI",system-ui,sans-serif; }
  header { padding:18px 26px 8px; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:26px; margin:0; }
  header .sub { color:var(--dim); font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ok); margin-right:6px; }
  .dot.dead { background:var(--bad); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:14px 26px 30px; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .panel h2 { margin:0 0 12px; font-size:17px; letter-spacing:.5px; }
  .big { font-size:34px; font-weight:700; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed #1d2537; font-size:15px; }
  .row:last-child { border-bottom:none; }
  .dim { color:var(--dim); } .small { font-size:12.5px; }
  .bar { height:14px; background:#1c2436; border-radius:7px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; background:var(--accent); transition:width .5s; }
  .bar > div.hot { background:var(--bad); }
  .card { border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:12px; background:#10141f; }
  .card .nm { font-size:16.5px; font-weight:600; }
  .badge { font-size:11.5px; padding:2px 8px; border-radius:9px; background:#1e3a2a; color:var(--ok); }
  .badge.off { background:#3a1e1e; color:var(--bad); }
  button { cursor:pointer; border:none; border-radius:9px; padding:9px 18px; font-size:15px; font-weight:600; }
  .btn-ok { background:var(--ok); color:#06130b; }
  .btn-no { background:#2a3247; color:var(--txt); }
  .btn-danger { background:#5a1f1f; color:#ffb3b3; border:1px solid #8a3434; }
  button:disabled { opacity:.45; cursor:wait; }
  .req { border:1px solid var(--warn); border-radius:12px; padding:13px 15px; margin-bottom:12px; background:#1d1808; }
  .req.done { border-color:var(--line); background:#10141f; opacity:.65; }
  .feed { font-size:13.5px; line-height:1.75; max-height:330px; overflow:auto; }
  .feed .blk { color:#5b6a8c; font-size:11.5px; }
  .mono { font-family:Consolas,monospace; }
  #walletBar { padding:0 26px; display:flex; gap:10px; align-items:center; }
  .err { color:var(--bad); font-size:13px; padding:0 26px; min-height:18px; }
</style>
</head>
<body>
<header>
  <h1>🛡️ SpendSeal 团队预算池</h1>
  <span class="sub">一个池子 · 多张卡 · 分账可查 · 超额要人批</span>
  <span class="sub" id="poolStatus"><span class="dot"></span>连接中…</span>
</header>
<div id="walletBar">
  <button class="btn-no" id="btnConnect">连接主人钱包（批准/熔断用）</button>
  <span class="small dim" id="walletInfo">只读模式：可看不可批</span>
</div>
<div class="err" id="errBox"></div>
<main>
  <section class="panel">
    <h2>💰 预算池（Pool #1）</h2>
    <div class="big" id="pBalance">— USDC</div>
    <div class="small dim">池余额（所有卡共享）</div>
    <div class="bar"><div id="pDailyBar" style="width:0%"></div></div>
    <div class="row"><span class="dim">今日全池已花 / 总日限</span><span id="pDaily">—</span></div>
    <div class="row"><span class="dim">单笔上限（任何卡、含批准例外）</span><span id="pSingle">—</span></div>
    <div class="row"><span class="dim">累计总支出</span><span id="pTotal">—</span></div>
    <div class="row"><span class="dim">合约</span><span class="mono small" id="pAddr">—</span></div>
    <div style="margin-top:14px; display:flex; gap:10px;">
      <button class="btn-danger" id="btnRevoke">⛔ 熔断整个池子（所有卡立即停付）</button>
    </div>
  </section>

  <section class="panel">
    <h2>💳 分账：每张卡今天花了多少</h2>
    <div id="cards"><div class="dim">加载中…</div></div>
  </section>

  <section class="panel">
    <h2>✋ 超额待批（Agent 申请 → 主人批准才放款）</h2>
    <div id="requests"><div class="dim">暂无申请</div></div>
  </section>

  <section class="panel">
    <h2>📜 池子动态（链上事件）</h2>
    <div class="feed" id="feed"><div class="dim">加载中…</div></div>
  </section>
</main>

<script>
"use strict";
// ===== 配置 =====
const POOL = "0xc3cd8c06377401574f8825443f60a18ac748963c";
const POOL_ID = 1n;
const RPC = "https://testnet-rpc.monad.xyz";
const CHAIN_ID_HEX = "0x27a7"; // 10143
const LABELS = {
  "0xf58214785825c8faebb89a61c666fffc60677ea1": "主人 owner",
  "0x69637d5da344decbee8be1bffa043c886b7f6f20": "卡 A · 主 Agent",
  "0x4498e909f689898c1236f88c8730bab9d3b7dfb3": "卡 B · 批量采购 Agent",
  "0xc451a5183a5ecd4f96f7c65bfda63a89c8ecba06": "卖家（截图 API）",
};
const SEL = {
  getPassport: "0x9f5679f4", revoke: "0x20c5429b",
  getCard: "0x619598a4", cardCount: "0x92a5afd2", cardAt: "0x053037b9",
  getRequest: "0x6a028907", approveRequest: "0x2c0a90a9", rejectRequest: "0x3d1894af",
};
const TOPIC = {
  executed: "0xb416667e3544549e9de43167eede842b8753db27f89921e395a027b03bca87a9",
  rejected: "0x2a3dead947b64b031bf7c449ccf92ac3d1ea47a5189dd20088c17342d821034f",
  reqNew: "0x592a342732cf34df3579317b2664272383a8fb3284d8a6e4296f208236d5a4e4",
  reqDone: "0xa2f910324771d89f30dfe06a336ce61fe77caaad6bc22fdc9f5da9d16a64a6f5",
  reqNo: "0x1310f9f0b012ea357778bf3b5c8a611a49de4f2268733f6fd200dbd3551227ad",
};
const REASON = { 2:"已熔断", 3:"已过期", 4:"收款方不在白名单", 5:"超单笔上限", 6:"池子总日限已满", 7:"池余额不足", 9:"卡子额度已满" };

// ===== 工具 =====
const $ = (id) => document.getElementById(id);
const word = (v) => BigInt(v).toString(16).padStart(64, "0");
const addrWord = (a) => "000000000000000000000000" + a.toLowerCase().replace("0x", "");
const usdc = (u) => (Number(u) / 1e6).toFixed(2) + " USDC";
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
const label = (a) => LABELS[a.toLowerCase()] ?? short(a);
const words = (hex) => { const h = hex.replace("0x", ""); const out = []; for (let i = 0; i + 64 <= h.length; i += 64) out.push(h.slice(i, i + 64)); return out; };
const wAddr = (w) => "0x" + w.slice(24);
const err = (m) => { $("errBox").textContent = m || ""; };

async function rpc(method, params) {
  const r = await fetch(RPC, { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result;
}
const call = (data) => rpc("eth_call", [{ to: POOL, data }, "latest"]);
const enc2 = (sel, a, b) => sel + word(a) + word(b);

// ===== 读状态 =====
let knownRequests = new Map(); // rid(string) -> {agent, payee, amount, ref}
let feedItems = [];
let scannedTo = null;

async function readPool() {
  const res = await call(SEL.getPassport + word(POOL_ID));
  const w = words(res);
  return { owner: wAddr(w[0]), agent: wAddr(w[1]), single: BigInt("0x" + w[2]), daily: BigInt("0x" + w[3]),
           spent: BigInt("0x" + w[4]), total: BigInt("0x" + w[6]), revoked: BigInt("0x" + w[8]) !== 0n,
           balance: BigInt("0x" + w[10]) };
}
async function readCards() {
  const n = Number(BigInt(await call(SEL.cardCount + word(POOL_ID))));
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = wAddr(words(await call(SEL.cardAt + word(POOL_ID) + word(i)))[0]);
    const w = words(await call(SEL.getCard + word(POOL_ID) + addrWord(a)));
    out.push({ addr: a, active: BigInt("0x" + w[0]) !== 0n, cap: BigInt("0x" + w[1]), spent: BigInt("0x" + w[2]) });
  }
  return out;
}
async function scanLogs() {
  const latest = BigInt(await rpc("eth_blockNumber", []));
  if (scannedTo === null) scannedTo = latest > 3000n ? latest - 3000n : 0n;
  if (latest <= scannedTo) return;
  for (let from = scannedTo + 1n; from <= latest; from += 100n) {
    const to = from + 99n > latest ? latest : from + 99n;
    const logs = await rpc("eth_getLogs", [{ address: POOL, fromBlock: "0x" + from.toString(16), toBlock: "0x" + to.toString(16) }]);
    for (const lg of logs) {
      const t = lg.topics[0];
      const blk = Number(BigInt(lg.blockNumber));
      if (t === TOPIC.reqNew) {
        const rid = BigInt(lg.topics[2]).toString();
        const d = words(lg.data);
        knownRequests.set(rid, { agent: wAddr(lg.topics[3]), payee: wAddr(d[0]), amount: BigInt("0x" + d[1]), ref: "0x" + d[2] });
        feedItems.push({ blk, txt: `✋ 申请 #${rid}：${label(wAddr(lg.topics[3]))} 请求付 ${usdc(BigInt("0x" + d[1]))} 给 ${label(wAddr(d[0]))}` });
      } else if (t === TOPIC.executed) {
        const d = words(lg.data);
        feedItems.push({ blk, txt: `✅ 付款：${usdc(BigInt("0x" + d[0]))} → ${label(wAddr(lg.topics[2]))}` });
      } else if (t === TOPIC.rejected) {
        const d = words(lg.data);
        feedItems.push({ blk, txt: `🚫 被拒：${usdc(BigInt("0x" + d[0]))} → ${label(wAddr(lg.topics[2]))}（${REASON[Number(BigInt("0x" + d[1]))] ?? "规则拦截"}，已上链留痕）` });
      } else if (t === TOPIC.reqDone) {
        feedItems.push({ blk, txt: `👍 申请 #${BigInt(lg.topics[2])} 已批准并付款` });
      } else if (t === TOPIC.reqNo) {
        feedItems.push({ blk, txt: `👎 申请 #${BigInt(lg.topics[2])} 被主人拒绝` });
      }
    }
    scannedTo = to;
  }
}
async function readRequests() {
  const out = [];
  for (const [rid, r] of knownRequests) {
    const w = words(await call(SEL.getRequest + word(POOL_ID) + word(BigInt(rid))));
    out.push({ rid, ...r, state: Number(BigInt("0x" + w[4])) });
  }
  return out.sort((a, b) => Number(BigInt(a.rid) - BigInt(b.rid)));
}

// ===== 渲染 =====
function render(pool, cards, reqs) {
  $("pAddr").textContent = POOL;
  $("poolStatus").innerHTML = pool.revoked
    ? '<span class="dot dead"></span>池子已熔断'
    : '<span class="dot"></span>池子运行中 · Monad 测试网';
  $("pBalance").textContent = usdc(pool.balance);
  const pct = pool.daily === 0n ? 0 : Math.min(100, Number(pool.spent * 100n / pool.daily));
  const bar = $("pDailyBar");
  bar.style.width = pct + "%";
  bar.classList.toggle("hot", pool.spent > pool.daily);
  $("pDaily").textContent = `${usdc(pool.spent)} / ${usdc(pool.daily)}` + (pool.spent > pool.daily ? "（超出部分 = 主人批准的例外）" : "");
  $("pSingle").textContent = usdc(pool.single);
  $("pTotal").textContent = usdc(pool.total);

  $("cards").innerHTML = cards.map((c) => {
    const p2 = c.cap === 0n ? 0 : Math.min(100, Number(c.spent * 100n / c.cap));
    const hot = c.spent > c.cap;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
      <span class="nm">${label(c.addr)}</span><span class="badge ${c.active ? "" : "off"}">${c.active ? "使用中" : "已停卡"}</span></div>
      <div class="bar"><div style="width:${p2}%" class="${hot ? "hot" : ""}"></div></div>
      <div class="small dim">今日已花 ${usdc(c.spent)} / 子额度 ${usdc(c.cap)}${hot ? "（含主人批准例外）" : ""} · <span class="mono">${short(c.addr)}</span></div></div>`;
  }).join("") || '<div class="dim">暂无卡</div>';

  const pend = reqs.filter((r) => r.state === 1);
  const done = reqs.filter((r) => r.state !== 1).slice(-3);
  $("requests").innerHTML =
    (pend.map((r) => `<div class="req"><div style="font-size:16px"><b>申请 #${r.rid}</b> · ${label(r.agent)} 想付 <b>${usdc(r.amount)}</b></div>
      <div class="small dim" style="margin:4px 0 10px">收款方 ${label(r.payee)} · 这笔钱超出了自动放行额度，需要主人点头</div>
      <button class="btn-ok" onclick="decide(${r.rid}, true)">批准并付款</button>
      <button class="btn-no" onclick="decide(${r.rid}, false)">拒绝</button></div>`).join("") ||
      '<div class="dim" style="margin-bottom:10px">暂无待批申请</div>') +
    done.map((r) => `<div class="req done"><b>申请 #${r.rid}</b> · ${label(r.agent)} · ${usdc(r.amount)} —— ${r.state === 2 ? "✅ 已批准付款" : "👎 已拒绝"}</div>`).join("");

  $("feed").innerHTML = feedItems.slice(-18).reverse()
    .map((f) => `<div>${f.txt} <span class="blk">#${f.blk}</span></div>`).join("") || '<div class="dim">暂无事件</div>';
}

async function refresh() {
  try {
    await scanLogs();
    const [pool, cards, reqs] = await Promise.all([readPool(), readCards(), readRequests()]);
    render(pool, cards, reqs);
    err("");
  } catch (e) { err("读取链上状态失败：" + e.message); }
}

// ===== 钱包写入 =====
let account = null;
$("btnConnect").onclick = async () => {
  try {
    if (!window.ethereum) { err("没检测到 MetaMask，请在装了 MetaMask 的浏览器打开本页"); return; }
    const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_ID_HEX }] })
      .catch(() => {});
    account = accs[0];
    $("walletInfo").textContent = "已连接：" + label(account) + "（" + short(account) + "）";
    err("");
  } catch (e) { err("连接钱包失败：" + e.message); }
};
async function sendTx(data, btn) {
  if (!account) { err("先点「连接主人钱包」"); return; }
  btn.disabled = true;
  try {
    await window.ethereum.request({ method: "eth_sendTransaction",
      params: [{ from: account, to: POOL, data }] });
    setTimeout(refresh, 2500);
  } catch (e) { err("交易失败：" + (e.message || e)); }
  btn.disabled = false;
}
window.decide = (rid, ok) => {
  const btn = event.currentTarget;
  sendTx((ok ? SEL.approveRequest : SEL.rejectRequest) + word(POOL_ID) + word(BigInt(rid)), btn);
};
$("btnRevoke").onclick = (e) => {
  if (!confirm("确认熔断整个池子？所有卡立即停付，不可恢复（余额仍可提回）。")) return;
  sendTx(SEL.revoke + word(POOL_ID), e.currentTarget);
};

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
